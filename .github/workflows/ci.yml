name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck / lint / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Run e2e
        run: bunx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust (wasm parity oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine
      - name: Cargo test
        run: cargo test --manifest-path crates/engine/Cargo.toml

  python:
    name: Python (agent service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r services/agents/requirements.txt -r services/agents/requirements-dev.txt
      - name: Pytest
        run: python -m pytest tests -q
        working-directory: services/agents

  ruby:
    name: Ruby (content pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruby tests
        run: ruby bin/pipeline_test.rb

  perl:
    name: Perl (log extractor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Perl tests
        run: perl bin/xtract_test.pl

  go:
    name: Go (parity oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go test
        run: go test ./...
        working-directory: services/parity-go
